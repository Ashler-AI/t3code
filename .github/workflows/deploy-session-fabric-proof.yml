name: Deploy session fabric proof

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy or destroy the isolated proof Worker
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

permissions:
  contents: read
  id-token: none

concurrency:
  group: session-fabric-proof
  cancel-in-progress: false

jobs:
  session_fabric:
    name: ${{ inputs.operation == 'deploy' && 'Deploy' || 'Destroy' }} session fabric proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: session-fabric-proof
    env:
      ALCHEMY_TELEMETRY_DISABLED: "1"
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SESSION_FABRIC_ALLOWED_ORIGINS: ${{ vars.SESSION_FABRIC_ALLOWED_ORIGINS }}
      SESSION_FABRIC_AUTH_MODE: required
      SESSION_FABRIC_CAPABILITY_AUDIENCE: t3code-session-fabric-proof
      SESSION_FABRIC_CAPABILITY_ISSUER: https://session-fabric-proof.t3.tools
    outputs:
      relay_url: ${{ steps.endpoint.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Generate ephemeral proof verifier
        if: inputs.operation == 'deploy'
        run: node infra/session-fabric/scripts/deployment-proof-auth.ts verifier

      - name: Apply isolated proof stack
        if: inputs.operation == 'deploy'
        run: vp run --filter @t3tools/session-fabric-worker deploy --stage proof --yes
        env:
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          BASETEN_EMBEDDING_URL: ${{ vars.BASETEN_EMBEDDING_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - id: endpoint
        name: Resolve public Relay endpoint
        if: inputs.operation == 'deploy'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          subdomain="$(node -e '
            const response = JSON.parse(process.argv[1]);
            if (response.success !== true || typeof response.result?.subdomain !== "string") {
              throw new Error("Cloudflare did not return a workers.dev subdomain");
            }
            process.stdout.write(response.result.subdomain);
          ' "$response")"
          relay_url="https://ashler-session-fabric-proof.${subdomain}.workers.dev"
          echo "relay_url=${relay_url}" >> "$GITHUB_OUTPUT"
          echo "### Session fabric proof" >> "$GITHUB_STEP_SUMMARY"
          echo "Relay URL: ${relay_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Mint short-lived viewer and runner capabilities
        if: inputs.operation == 'deploy'
        run: node infra/session-fabric/scripts/deployment-proof-auth.ts capabilities

      - name: Verify deployed session fabric behavior
        if: inputs.operation == 'deploy'
        run: >-
          vp run --filter @t3tools/session-fabric-worker smoke:deployment --
          --relay-url "${{ steps.endpoint.outputs.relay_url }}"
          --scaffold-origin "${SESSION_FABRIC_SMOKE_SCAFFOLD_ORIGIN}"
          --marker "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --timeout 30000

      - name: Remove ephemeral proof signing key
        if: always() && inputs.operation == 'deploy'
        shell: bash
        run: rm -f "${SESSION_FABRIC_PROOF_PRIVATE_KEY_PATH:-}"

      - name: Destroy isolated proof stack
        if: inputs.operation == 'destroy'
        run: vp run --filter @t3tools/session-fabric-worker destroy --stage proof --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
